name: nebula-preserved
x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3", compress: "true"}
services:
  server:
    logging: *default-logging
    image: nebula-preserved-server:local
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${NEBULA_PIDS_LIMIT:-4096}
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    environment:
      NEBULA_MODE: ${NEBULA_MODE:-private}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-private}
      NEBULA_ADVERTISE_IP: ${NEBULA_ADVERTISE_IP:-127.0.0.1}
      NEBULA_BUILD_REPORT_SHA256: ${NEBULA_BUILD_REPORT_SHA256:?Set the reviewed build report hash}
      NEBULA_SERVER_SHA256: ${NEBULA_SERVER_SHA256:?Set the reviewed ELF hash}
      NEBULA_MANAGED_SHA256: ${NEBULA_MANAGED_SHA256:?Set the reviewed Assembly-CSharp hash}
      NEBULA_MAX_PROCESSES: ${NEBULA_MAX_PROCESSES:-16}
      NEBULA_IDLE_TTL: ${NEBULA_IDLE_TTL:-60}
      NEBULA_PERSONAL_WORLD_IDLE_SECONDS: ${NEBULA_PERSONAL_WORLD_IDLE_SECONDS:-}
      NEBULA_PUBLIC_WORLD_IDLE_SECONDS: ${NEBULA_PUBLIC_WORLD_IDLE_SECONDS:-900}
      NEBULA_STARTER_CRYSTALS: ${NEBULA_STARTER_CRYSTALS:-0}
      NEBULA_STARTER_NP: ${NEBULA_STARTER_NP:-0}
      NEBULA_STARTER_APARTMENTS: ${NEBULA_STARTER_APARTMENTS:-}
      NEBULA_ENROLLMENT_MAX_ACCOUNTS: ${NEBULA_ENROLLMENT_MAX_ACCOUNTS:-1000}
      NEBULA_ENROLLMENT_PER_IP_HOURLY: ${NEBULA_ENROLLMENT_PER_IP_HOURLY:-}
      NEBULA_ENROLLMENT_GLOBAL_HOURLY: ${NEBULA_ENROLLMENT_GLOBAL_HOURLY:-}
      NEBULA_PROTECT_STAFF_ACCOUNTS: ${NEBULA_PROTECT_STAFF_ACCOUNTS:-1}
      NEBULA_PROTECTED_ACCOUNTS: ${NEBULA_PROTECTED_ACCOUNTS:-}
      NEBULA_CATALOG_POLICY: ${NEBULA_CATALOG_POLICY:-preservation-catalog-v1}
      NEBULA_PUBLIC_ENROLLMENT: ${NEBULA_PUBLIC_ENROLLMENT:-0}
      NEBULA_TRUST_STEAM_ID: ${NEBULA_TRUST_STEAM_ID:-0}
      NEBULA_ADMIN_BIND: 0.0.0.0
      NEBULA_ADMIN_PORT: "8090"
      NEBULA_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      NEBULA_ADMIN_OPERATORS_FILE: /run/secrets/admin_operators.json
    secrets:
      - admin_token
      - source: admin_operators
        target: admin_operators.json
    volumes:
      - state:/var/lib/nebula
    # Only enabled sidecars listen on the mapped proxy/gateway ports.
    # 8090 is deliberately absent: SSR reaches it on the internal bridge.
    ports:
      - "${NEBULA_HOST_BIND:-127.0.0.1}:8080:8081/tcp"
      - "${NEBULA_HOST_BIND:-127.0.0.1}:28000-28031:28000-28031/tcp"
    healthcheck:
      test: [CMD, python, /opt/nebula-container/healthcheck.py]
      interval: 10s
      timeout: 4s
      start_period: 45s
      retries: 3
  private-http:
    logging: *default-logging
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    profiles: [private]
    network_mode: service:server
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16m,mode=1777"]
    volumes:
      - ./nginx-private.conf:/etc/nginx/nginx.conf:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        health="$$(wget -q -T 3 -O - http://127.0.0.1:8080/preservation/health)"
        printf '%s' "$$health" | grep -Eq '"public_access"[[:space:]]*:[[:space:]]*false'
        exec nginx -g 'daemon off;'
    restart: unless-stopped
    depends_on:
      server: {condition: service_healthy}
  panel:
    logging: *default-logging
    image: nebula-preserved-panel:local
    platform: linux/amd64
    build:
      context: ../../admin-panel
      dockerfile: Dockerfile
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${NEBULA_PANEL_HOST_BIND:-127.0.0.1}:4321:4321/tcp"
    environment:
      PORT: "4321"
      HOST: 0.0.0.0
      NODE_ENV: production
      NEBULA_MANAGEMENT_URL: http://server:8090
      NEBULA_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      NEBULA_ADMIN_OPERATORS_FILE: /run/secrets/admin_operators.json
      NEBULA_PANEL_SESSION_KEY_FILE: /run/secrets/panel_session_key
      NEBULA_PANEL_ORIGIN: ${NEBULA_PANEL_ORIGIN:-http://localhost:4321}
      NEBULA_CATALOG_PREVIEW_DIR: /opt/nebula/catalog-previews
    volumes:
      - ${NEBULA_CATALOG_PREVIEW_SOURCE:-./catalog-previews}:/opt/nebula/catalog-previews:ro
    secrets:
      - admin_token
      - source: admin_operators
        target: admin_operators.json
      - panel_session_key
    depends_on:
      server: {condition: service_healthy}
  public-https:
    logging: *default-logging
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    profiles: [public]
    network_mode: service:server
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16m,mode=1777"]
    volumes:
      - ./nginx-public.conf:/etc/nginx/nginx.conf:ro
    secrets: [tls_certificate, tls_private_key]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        health="$$(wget -q -T 3 -O - http://127.0.0.1:8080/preservation/health)"
        printf '%s' "$$health" | grep -Eq '"public_access"[[:space:]]*:[[:space:]]*true'
        exec nginx -g 'daemon off;'
    restart: unless-stopped
    depends_on:
      server: {condition: service_healthy}
  public-game:
    logging: *default-logging
    image: nebula-preserved-server:local
    platform: linux/amd64
    profiles: [public]
    network_mode: service:server
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16m,mode=1777"]
    volumes:
      - state:/var/lib/nebula:ro
      # Only state/logs is writable: rotated gateway.jsonl survives container recreation.
      # The server creates logs/ (uid 1000) before it reports healthy. Engine >=26, Compose >=2.30.
      - {type: volume, source: state, target: /var/lib/nebula/logs, volume: {subpath: logs}}
    secrets: [tls_certificate, tls_private_key]
    entrypoint: [python, /opt/nebula/backend/remote_gateway.py]
    command: [--listen, --bind, 0.0.0.0, --port, "8443", --first-scene-port, "28000", --last-scene-port, "28031", --state-dir, /var/lib/nebula, --certificate, /run/secrets/tls_certificate, --private-key, /run/secrets/tls_private_key]
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      server: {condition: service_healthy}
volumes:
  state:
secrets:
  admin_token:
    file: ${NEBULA_ADMIN_TOKEN_SOURCE:-./secrets/admin-token.txt}
  admin_operators:
    file: ${NEBULA_ADMIN_OPERATORS_SOURCE:-./secrets/admin-operators.json}
  panel_session_key:
    file: ${NEBULA_PANEL_SESSION_KEY_SOURCE:-./secrets/panel-session-key.txt}
  tls_certificate:
    file: ${NEBULA_TLS_CERTIFICATE_SOURCE:-./secrets/fullchain.pem}
  tls_private_key:
    file: ${NEBULA_TLS_PRIVATE_KEY_SOURCE:-./secrets/server-key.pem}
