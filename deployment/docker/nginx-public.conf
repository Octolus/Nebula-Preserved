pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=credentials:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=enrollment:1m rate=2r/s;
    server {
        listen 8444 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_header_buffer_size 16k;
        large_client_header_buffers 4 64k;
        client_max_body_size 1m;
        location = /preservation/health { return 404; }
        location = /preservation/enroll {
            if ($request_method != POST) { return 405; }
            client_max_body_size 1k;
            limit_req zone=enrollment burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header X-Nebula-Enrollment-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_buffering off;
            add_header Cache-Control no-store always;
        }
        location / {
            limit_req zone=credentials burst=40 nodelay;
            if ($http_authorization = "") { return 401; }
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
    }
}
