---
- name: Deploy the reviewed Nebula preservation stack
  hosts: nebula
  become: true
  vars:
    nebula_root: /opt/nebula-preserved
  tasks:
    - name: Validate platform and reviewed pins
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version is version('26.04', '>=')
          - ansible_facts.architecture == 'x86_64'
          - nebula_root == '/opt/nebula-preserved'
          - nebula_public_ip is match('^[0-9.]+$')
          - nebula_image_archive_sha256 is match('^[0-9a-f]{64}$')
          - nebula_build_report_sha256 is match('^[0-9a-f]{64}$')
          - nebula_server_sha256 is match('^[0-9a-f]{64}$')
          - nebula_managed_sha256 is match('^[0-9a-f]{64}$')
          - (nebula_max_processes | default(4) | int) in range(1, 33)
          - (nebula_public_world_idle_seconds | default(900) | int) in range(0, 86401)
          - (nebula_personal_world_idle_seconds | default(60) | int) in range(0, 86401)
          - (nebula_starter_crystals | default(0) | int) >= 0
          - (nebula_starter_np | default(0) | int) >= 0
          - (nebula_starter_apartments | default(['Home']) | map('string') | select('match', '^[A-Za-z]{1,64}$') | list | length) == (nebula_starter_apartments | default(['Home']) | length)
          - (nebula_enrollment_max_accounts | default(1000) | int) >= 0
          - (nebula_protected_accounts | default([]) | map('string') | select('match', '^[0-9]{17}$') | list | length) == (nebula_protected_accounts | default([]) | length)
          - nebula_server_image is match('^[a-zA-Z0-9./:_@-]+$')
          - nebula_panel_image is match('^[a-zA-Z0-9./:_@-]+$')
          - (nebula_tls_mode | default('public_acme')) in ['public_acme', 'private_ca']
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, openssl, python3]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Harden SSH login (key-only, root by key only)
      when: nebula_ssh_hardening | default(true) | bool
      block:
        - name: Inspect authorized key files that must keep working
          ansible.builtin.stat: {path: '{{ item }}'}
          loop: "{{ nebula_ssh_authorized_keys_files | default(['/root/.ssh/authorized_keys']) }}"
          register: ssh_key_files
        - name: Read existing authorized key files
          ansible.builtin.slurp: {src: '{{ item.stat.path }}'}
          loop: '{{ ssh_key_files.results | selectattr("stat.exists") | list }}'
          loop_control: {label: '{{ item.stat.path }}'}
          register: ssh_key_contents
        - name: Count usable public keys
          ansible.builtin.set_fact:
            nebula_ssh_usable_keys: >-
              {{ ssh_key_contents.results | map(attribute='content') | map('b64decode')
                 | map('split', '\n') | flatten
                 | select('match', '^[^#]*(ssh-(ed25519|rsa|dss)|ecdsa-sha2-|sk-(ssh|ecdsa))')
                 | list | length }}
        - name: Never disable passwords without an authorized key (lockout guard)
          ansible.builtin.assert:
            that: nebula_ssh_usable_keys | int > 0
            fail_msg: >-
              No usable key in {{ nebula_ssh_authorized_keys_files | default(['/root/.ssh/authorized_keys']) }}.
              Install a key first or set nebula_ssh_hardening=false.
        - name: Install SSH hardening drop-in (00- so it wins over cloud-image 50-* settings)
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/00-nebula-hardening.conf
            mode: '0644'
            content: |
              # Managed by Nebula Ansible (nebula_ssh_hardening). sshd uses the first value seen.
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              PermitRootLogin prohibit-password
          register: ssh_dropin
          notify: Reload sshd
        - name: Validate the complete sshd configuration before any reload
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false
      rescue:
        - name: Remove an sshd drop-in that failed validation
          ansible.builtin.file: {path: /etc/ssh/sshd_config.d/00-nebula-hardening.conf, state: absent}
          when: ssh_dropin is defined and ssh_dropin.changed
        - name: Stop after a refused SSH hardening change
          ansible.builtin.fail:
            msg: SSH hardening was refused (see the previous error); sshd was not reloaded with it.
    - name: Protect SSH with fail2ban
      when: nebula_fail2ban | default(true) | bool
      block:
        - name: Install fail2ban with journal support
          ansible.builtin.apt:
            name: [fail2ban, python3-systemd]
            state: present
        - name: Configure the sshd jail
          ansible.builtin.copy:
            dest: /etc/fail2ban/jail.d/nebula-sshd.local
            mode: '0644'
            content: |
              # Managed by Nebula Ansible (nebula_fail2ban). Host sshd only; Docker ports are not jailed.
              [sshd]
              enabled = true
              backend = systemd
              maxretry = {{ nebula_fail2ban_maxretry | default(5) }}
              findtime = 10m
              bantime = {{ nebula_fail2ban_bantime | default('1h') }}
          notify: Restart fail2ban
        - name: Enable fail2ban
          ansible.builtin.systemd_service: {name: fail2ban, enabled: true, state: started}
    - name: Enable host firewall (opt-in; Docker-published ports bypass ufw)
      when: nebula_ufw | default(false) | bool
      block:
        - name: Install ufw
          ansible.builtin.apt: {name: ufw, state: present}
        - name: Allow SSH and the public service ports before enabling
          ansible.builtin.command:
            argv: [ufw, allow, '{{ item }}/tcp']
          loop: "{{ nebula_ufw_allowed_tcp | default([22, 80, 443, 8443, 8444]) }}"
          register: ufw_rule
          changed_when: "'Skipping' not in ufw_rule.stdout"
        - name: Default-deny other inbound host traffic and enable ufw
          ansible.builtin.command:
            argv: [ufw, --force, enable]
          register: ufw_enable
          changed_when: "'already' not in ufw_enable.stdout"
    - name: Create Docker keyring directory
      ansible.builtin.file: {path: /etc/apt/keyrings, state: directory, mode: '0755'}
    - name: Install official Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    - name: Configure official Docker repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nebula-docker.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts.distribution_release }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true
    - name: Enable Docker at boot
      ansible.builtin.systemd_service: {name: docker, state: started, enabled: true}
    - name: Inspect Docker data root for the backup unit
      ansible.builtin.command:
        argv: [docker, info, --format, '{{ "{{.DockerRootDir}}" }}']
      register: docker_root
      changed_when: false
    - name: Require the supported volume location
      ansible.builtin.assert:
        that: docker_root.stdout == '/var/lib/docker'
        fail_msg: Custom Docker data roots need an explicitly adapted backup unit.
    - name: Create deployment directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop: ['{{ nebula_root }}', /var/backups/nebula-preserved]
    - name: Check local image archive hash
      ansible.builtin.stat:
        path: '{{ nebula_image_archive }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: archive
    - name: Admit exact reviewed archive
      ansible.builtin.assert:
        that: archive.stat.checksum == nebula_image_archive_sha256
    - name: Upload reviewed images
      ansible.builtin.copy:
        src: '{{ nebula_image_archive }}'
        dest: '{{ nebula_root }}/images.tar'
        mode: '0600'
      register: image_upload
    - name: Load reviewed images
      ansible.builtin.command: docker load --input {{ nebula_root }}/images.tar
      changed_when: image_upload.changed
      async: 600
      poll: 5
    - name: Inspect exact loaded image identities
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, '{{ "{{.Id}}" }}', '{{ item.key }}']
      loop: '{{ nebula_expected_image_ids | default({}) | dict2items }}'
      register: loaded_image
      changed_when: false
      failed_when: loaded_image.stdout not in item.value
    - name: Install base compose and public-only exposure
      ansible.builtin.copy:
        src: '../docker/{{ item }}'
        dest: '{{ nebula_root }}/{{ item }}'
        mode: "{{ '0644' if item == 'nginx-public.conf' else '0600' }}"
      loop: [compose.yaml, compose.public.yaml, nginx-public.conf]
      register: base_files
    - name: Preserve or create optional catalog preview directory
      ansible.builtin.file:
        path: '{{ nebula_root }}/catalog-previews'
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Install optional private catalog preview pack
      when: nebula_catalog_preview_archive is defined
      block:
        - name: Validate preview archive pin
          ansible.builtin.assert:
            that:
              - nebula_catalog_preview_archive_sha256 is defined
              - nebula_catalog_preview_archive_sha256 is match('^[0-9a-f]{64}$')
        - name: Inspect local private preview archive
          ansible.builtin.stat:
            path: '{{ nebula_catalog_preview_archive }}'
            checksum_algorithm: sha256
            follow: false
          delegate_to: localhost
          become: false
          register: preview_archive
        - name: Admit exact regular preview archive
          ansible.builtin.assert:
            that:
              - preview_archive.stat.isreg | default(false)
              - not (preview_archive.stat.islnk | default(false))
              - preview_archive.stat.checksum | default('') == nebula_catalog_preview_archive_sha256
        - name: Install preview pack validator
          ansible.builtin.copy:
            src: files/install-catalog-previews.py
            dest: '{{ nebula_root }}/install-catalog-previews.py'
            mode: '0700'
        - name: Upload private preview archive
          ansible.builtin.copy:
            src: '{{ nebula_catalog_preview_archive }}'
            dest: '{{ nebula_root }}/catalog-previews.tar'
            mode: '0600'
        - name: Validate and atomically activate preview pack
          ansible.builtin.command:
            argv: [python3, '{{ nebula_root }}/install-catalog-previews.py', --archive, '{{ nebula_root }}/catalog-previews.tar', --sha256, '{{ nebula_catalog_preview_archive_sha256 }}', --root, '{{ nebula_root }}']
          register: preview_pack
          changed_when: (preview_pack.stdout | from_json).changed
    - name: Install panel proxy
      ansible.builtin.copy:
        src: files/nginx-panel.conf
        dest: '{{ nebula_root }}/nginx-panel.conf'
        mode: '0644'
      register: panel_proxy
    - name: Render private runtime settings
      ansible.builtin.template:
        src: templates/{{ item }}.j2
        dest: '{{ nebula_root }}/{{ item }}'
        mode: '0600'
      loop: [runtime.env, compose.host.yaml]
      register: settings
    - name: Install secret bootstrap
      ansible.builtin.copy:
        src: files/bootstrap-secrets.py
        dest: '{{ nebula_root }}/bootstrap-secrets.py'
        mode: '0700'
    - name: Create stable account authority and random owner credentials if absent
      ansible.builtin.command:
        argv: [python3, '{{ nebula_root }}/bootstrap-secrets.py', '{{ nebula_public_ip }}', '{{ nebula_tls_mode | default("public_acme") }}']
      changed_when: false
      no_log: true
    - name: Configure autonomous public IP certificates
      when: (nebula_tls_mode | default('public_acme')) == 'public_acme'
      block:
        - name: Create private ACME storage and public challenge directories
          ansible.builtin.file:
            path: '{{ nebula_root }}/{{ item.path }}'
            state: directory
            mode: '{{ item.mode }}'
          loop:
            - {path: acme, mode: '0700'}
            - {path: acme/config, mode: '0700'}
            - {path: acme/webroot, mode: '0755'}
            - {path: acme/webroot/.well-known, mode: '0755'}
            - {path: acme/webroot/.well-known/acme-challenge, mode: '0755'}
        - name: Install isolated challenge server and certificate manager
          ansible.builtin.copy:
            src: files/{{ item }}
            dest: '{{ nebula_root }}/{{ item }}'
            mode: '0644'
          loop: [nginx-acme.conf, acme-http.compose.yaml, manage-public-tls.py]
          register: acme_files
        - name: Install public TLS boot service and renewal timer
          ansible.builtin.copy:
            src: files/{{ item }}
            dest: /etc/systemd/system/{{ item }}
            mode: '0644'
          loop: [nebula-preserved-acme-http.service, nebula-preserved-public-tls.timer]
        - name: Install address-bound renewal service
          ansible.builtin.template:
            src: templates/nebula-preserved-public-tls.service.j2
            dest: /etc/systemd/system/nebula-preserved-public-tls.service
            mode: '0644'
        - name: Start challenge-only HTTP responder before certificate issuance
          ansible.builtin.systemd_service:
            name: nebula-preserved-acme-http
            daemon_reload: true
            enabled: true
            state: "{{ 'restarted' if acme_files.changed else 'started' }}"
        - name: Inspect existing public certificate lineage
          ansible.builtin.stat:
            path: '{{ nebula_root }}/acme/config/live/nebula-public/cert.pem'
          register: public_lineage
        - name: Verify HTTP challenge with staging before the first public issuance
          ansible.builtin.command:
            argv: [python3, '{{ nebula_root }}/manage-public-tls.py', preflight, --address, '{{ nebula_public_ip }}']
          when: not public_lineage.stat.exists
          changed_when: false
          async: 300
          poll: 5
        - name: Issue or retain a publicly trusted short-lived IP certificate
          ansible.builtin.command:
            argv: [python3, '{{ nebula_root }}/manage-public-tls.py', issue, --address, '{{ nebula_public_ip }}', --defer-runtime-refresh]
          register: public_tls
          changed_when: '"\"runtime_files_changed\": true" in public_tls.stdout'
          async: 300
          poll: 5
    - name: Validate compose before touching service
      ansible.builtin.command:
        argv: [docker, compose, --env-file, runtime.env, -f, compose.yaml, -f, compose.public.yaml, -f, compose.host.yaml, config, --quiet]
        chdir: '{{ nebula_root }}'
      changed_when: false
    - name: Inspect existing stack state
      ansible.builtin.command: systemctl is-active nebula-preserved
      register: existing_stack
      failed_when: false
      changed_when: false
    - name: Install offline first-start state verifier
      ansible.builtin.copy:
        src: files/initialize-state.py
        dest: '{{ nebula_root }}/initialize-state.py'
        mode: '0644'
    - name: Initialize and verify public authority before the first listener
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --user
          - '1000:1000'
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges:true
          - --mount
          - type=volume,src=nebula-preserved_state,dst=/var/lib/nebula
          - --mount
          - type=bind,src={{ nebula_root }}/operator/account-operator.key,dst=/operator/account-operator.key,readonly
          - --mount
          - type=bind,src={{ nebula_root }}/initialize-state.py,dst=/initialize-state.py,readonly
          - --entrypoint
          - python
          - '{{ nebula_server_image }}'
          - /initialize-state.py
      when: existing_stack.stdout != 'active'
      changed_when: false
    - name: Install consistent SQLite and instance-state backup utility
      ansible.builtin.copy:
        src: ../../tools/backup_state.py
        dest: '{{ nebula_root }}/backup_state.py'
        mode: '0644'
    - name: Install optional off-host backup hook
      ansible.builtin.copy:
        dest: '{{ nebula_root }}/backup-offsite.sh'
        mode: '0700'
        content: |
          #!/bin/sh
          # Managed by Ansible from nebula_backup_offsite_command. Runs after each
          # verified backup with NEBULA_BACKUP_{DIR,DATABASE,STATE_ARCHIVE,RECEIPT}.
          set -eu
          {{ nebula_backup_offsite_command }}
      when: nebula_backup_offsite_command | default('') | length > 0
    - name: Remove disabled off-host backup hook
      ansible.builtin.file: {path: '{{ nebula_root }}/backup-offsite.sh', state: absent}
      when: nebula_backup_offsite_command | default('') | length == 0
    - name: Install boot service and backup timer
      ansible.builtin.copy:
        src: files/{{ item }}
        dest: /etc/systemd/system/{{ item }}
        mode: '0644'
      loop: [nebula-preserved.service, nebula-preserved-backup.service, nebula-preserved-backup.timer]
      register: units
    - name: Inspect existing state database
      ansible.builtin.stat:
        path: /var/lib/docker/volumes/nebula-preserved_state/_data/preservation.sqlite3
      register: existing_state_db
    - name: Take a verified pre-deploy backup (retained separately from daily sets)
      ansible.builtin.command:
        argv: [python3, '{{ nebula_root }}/backup_state.py', --state-dir, /var/lib/docker/volumes/nebula-preserved_state/_data, --destination, /var/backups/nebula-preserved, --keep-days, '14', --keep-deploy, '5', --kind, deploy, --offsite-hook, '{{ nebula_root }}/backup-offsite.sh']
      when: existing_state_db.stat.exists
      changed_when: true
    - name: Start or refresh complete stack
      ansible.builtin.systemd_service:
        name: nebula-preserved
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if image_upload.changed or base_files.changed or panel_proxy.changed or settings.changed or units.changed or (public_tls.changed | default(false)) or (preview_pack.changed | default(false)) else 'started' }}"
    - name: Enable daily backups
      ansible.builtin.systemd_service: {name: nebula-preserved-backup.timer, enabled: true, state: started}
    - name: Enable hourly short-lived certificate renewal
      ansible.builtin.systemd_service: {name: nebula-preserved-public-tls.timer, enabled: true, state: started}
      when: (nebula_tls_mode | default('public_acme')) == 'public_acme'
    - name: Verify first consistent backup
      ansible.builtin.systemd_service: {name: nebula-preserved-backup.service, state: started}
    - name: Optionally verify actual reboot recovery
      ansible.builtin.reboot: {reboot_timeout: 300}
      when: nebula_verify_reboot | default(false) | bool
    - name: Wait for boot service recovery
      ansible.builtin.command: systemctl is-active nebula-preserved
      register: boot_health
      changed_when: false
      until: boot_health.rc == 0
      retries: 30
      delay: 5
    - name: Verify trusted API rejects anonymous access
      ansible.builtin.command:
        argv: '{{ ["curl", "--silent", "--show-error"] + (["--cacert", nebula_root + "/operator/ca.pem"] if (nebula_tls_mode | default("public_acme")) == "private_ca" else []) + ["--output", "/dev/null", "--write-out", "%{http_code}", "https://" + nebula_public_ip + ":8444/"] }}'
      register: api_health
      changed_when: false
      until: api_health.stdout == '401'
      retries: 20
      delay: 3
      failed_when: api_health.stdout != '401'
    - name: Verify trusted dashboard HTTPS
      ansible.builtin.command:
        argv: '{{ ["curl", "--silent", "--show-error"] + (["--cacert", nebula_root + "/operator/ca.pem"] if (nebula_tls_mode | default("public_acme")) == "private_ca" else []) + ["--output", "/dev/null", "--write-out", "%{http_code}", "https://" + nebula_public_ip + "/login"] }}'
      register: panel_health
      changed_when: false
      failed_when: panel_health.stdout != '200'
  handlers:
    - name: Reload sshd
      ansible.builtin.systemd_service: {name: ssh, state: reloaded}
    - name: Restart fail2ban
      ansible.builtin.systemd_service: {name: fail2ban, state: restarted}
