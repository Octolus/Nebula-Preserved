# The native client must be patched/configured to use HTTPS and send its
# per-account Authorization header. Plain HTTP public exposure is unsupported.
# Every uncached backend credential check performs synchronous scrypt. Keep a
# bounded per-source edge budget; burst headroom preserves the client's normal
# grouped bootstrap calls but must be acceptance-tested before public use.
limit_req_zone $binary_remote_addr zone=nebula_credentials:10m rate=5r/s;

server {
    listen 443 ssl http2;
    server_name REPLACE_WITH_HOSTNAME;
    ssl_certificate /etc/letsencrypt/live/REPLACE_WITH_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;
    client_max_body_size 1m;

    location = /preservation/health {
        allow 127.0.0.1;
        allow REPLACE_WITH_OPERATOR_CIDR;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=nebula_credentials burst=40 nodelay;
        if ($http_authorization = "") { return 401; }
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
