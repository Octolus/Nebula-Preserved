name: Quality checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reject private files and stale source inventory
        run: |
          python scripts/audit_public_tree.py
          python scripts/update_source_inventory.py --check
      - name: Publication and release-tool regression checks
        run: |
          python -m pip install -r scripts/requirements-ci.txt
          python scripts/run_unit_tests.py --suite tooling --report test-results/tooling.json
      - name: Upload tooling unit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tooling
          path: test-results/tooling.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate GitHub Actions syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  backend:
    name: Backend and portable Linux builder
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deployment/docker/requirements.lock.txt
      - run: python -m pip install -r deployment/docker/requirements.lock.txt
      - name: Backend, build, bundle and offline harness unit tests
        run: python scripts/run_unit_tests.py --suite backend --suite builder --suite bundles --suite harness --report test-results/backend.json
      - name: Ansible secret and TLS bootstrap edge tests
        run: python -B -m unittest discover -s deployment/ansible/tests -v
      - name: Upload backend unit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-backend-builder
          path: test-results/backend.json
          if-no-files-found: ignore
          retention-days: 7

  social-contracts:
    name: Scene social publication contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Keep compiler caches outside source
        run: |
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/social-dotnet-home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/social-nuget" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual scene social source without external packages
        run: >-
          dotnet build mirror-server/tests/social-contracts/SocialContracts.csproj
          --configuration Release
          -p:BaseIntermediateOutputPath="$RUNNER_TEMP/social-obj/"
          -p:BaseOutputPath="$RUNNER_TEMP/social-bin/"
      - name: Check durable authority and exact publication-expiry boundaries
        run: dotnet "$RUNNER_TEMP/social-bin/Release/net8.0/SocialContracts.dll" "$RUNNER_TEMP"

  panel:
    name: Panel tests, types and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-panel
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
