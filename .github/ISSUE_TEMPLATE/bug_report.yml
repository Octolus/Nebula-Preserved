name: Bug report
description: Report a reproducible preservation server, client patch or tooling problem.
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic accounts and sanitized output. Do not upload game binaries,
        databases, credentials, session exports, private keys or personal logs.
        For a suspected vulnerability, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the patch bundle version and server commit when available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, installation method and private or public TLS mode. Omit personal hostnames, IP addresses and account identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Start from a known state and list the actions needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: State what happened and whether another client or a fresh session confirmed it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: A short error excerpt or reproduction test is enough. Remove tokens, private paths, real account IDs and other personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private data and original game files from this report.
          required: true
