[package]
name = "nebula-preservation-patcher"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
fs2 = "0.4"
url = "2.5"
zeroize = "1.8"
lzma-rs = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10"
